name: Publish site JSON

on:
  push:
    branches:
      - main
      - feat/machine-readable-site-json
    paths:
      - index.html
      - scripts/generate-site-json.mjs
      - test/site-json.test.mjs
      - .github/workflows/site-json.yml
  pull_request:
    paths:
      - index.html
      - scripts/generate-site-json.mjs
      - test/site-json.test.mjs
      - .github/workflows/site-json.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-json-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public content extraction
        run: node --test test/site-json.test.mjs
      - name: Generate static JSON
        run: node scripts/generate-site-json.mjs
      - name: Commit refreshed JSON on repository pushes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git add site.json about.json services.json tools.json frameworks.json
          if git diff --cached --quiet; then
            echo "Site JSON is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public site JSON from homepage"
          git push
