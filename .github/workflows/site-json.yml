name: Publish site JSON

on:
  push:
    branches:
      - main
      - feat/seo-geo-visibility-foundation
    paths:
      - index.html
      - sitemap.xml
      - shipyard/index.html
      - open-org/index.html
      - responsible-ai/index.html
      - slow-post/index.html
      - scripts/generate-site-json.mjs
      - scripts/generate-item-json.mjs
      - scripts/generate-page-json.mjs
      - test/site-json.test.mjs
      - test/visibility.test.mjs
      - test/item-json.test.mjs
      - test/page-json.test.mjs
      - .github/workflows/site-json.yml
  pull_request:
    paths:
      - index.html
      - sitemap.xml
      - shipyard/index.html
      - open-org/index.html
      - responsible-ai/index.html
      - slow-post/index.html
      - scripts/generate-site-json.mjs
      - scripts/generate-item-json.mjs
      - scripts/generate-page-json.mjs
      - test/site-json.test.mjs
      - test/visibility.test.mjs
      - test/item-json.test.mjs
      - test/page-json.test.mjs
      - .github/workflows/site-json.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-json-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public content extraction
        run: node --test test/site-json.test.mjs test/page-json.test.mjs test/item-json.test.mjs test/visibility.test.mjs
      - name: Generate static JSON
        run: |
          node scripts/generate-site-json.mjs
          node scripts/generate-page-json.mjs
          node scripts/generate-item-json.mjs
      - name: Commit refreshed JSON on repository pushes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git add site.json about.json services.json tools.json frameworks.json shipyard/page.json open-org/page.json responsible-ai/page.json slow-post/page.json
          git add -A -- catalogue/tools catalogue/frameworks
          if git diff --cached --quiet; then
            echo "Site JSON is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public site and item JSON from HTML"
          # The branch may have gained another documentation/content commit while
          # this run was building. Replay the generated commit before publishing.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
