name: Build collaboration framework

on:
  push:
    branches:
      - main
    paths:
      - frameworks/build-collaboration-framework.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deck generator
        run: npm install --no-save --no-package-lock pptxgenjs

      - name: Build PowerPoint
        run: node frameworks/build-collaboration-framework.js

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress

      - name: Build PDF
        run: |
          libreoffice --headless --convert-to pdf --outdir frameworks frameworks/collaboration-spectrum-slides.pptx

      - name: Add PDF and PowerPoint links to framework card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<a href="frameworks/collaboration-spectrum-slides.pdf" aria-label="Download Collaboration Spectrum slides">Slides</a>'
          new = '<a href="/frameworks/collaboration-spectrum-slides.pdf" aria-label="Download Designing how we work together PDF">PDF</a>\n              <a href="/frameworks/collaboration-spectrum-slides.pptx" aria-label="Download Designing how we work together PowerPoint">Slides</a>'
          if old in s:
              s = s.replace(old, new)
          elif '/frameworks/collaboration-spectrum-slides.pptx' not in s:
              raise SystemExit('Collaboration framework link not found in index.html')
          p.write_text(s)
          PY

      - name: Commit generated framework assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frameworks/collaboration-spectrum-slides.pptx frameworks/collaboration-spectrum-slides.pdf index.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Publish collaboration framework slides"
          git push origin HEAD:${{ github.ref_name }}
