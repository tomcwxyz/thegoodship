<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — The Good Ship</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1B2A4A">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --navy: #1B2A4A;
      --cream: #F5F0E8;
      --teal: #2D8B7A;
      --amber: #D4993D;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--navy);
      color: var(--cream);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 38rem; }
    p:first-child {
      margin: 0 0 1rem;
      color: var(--amber);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 1rem;
      font-family: Georgia, serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 1;
    }
    p { line-height: 1.65; }
    a { color: var(--cream); text-underline-offset: 0.2em; }
    a:hover { color: var(--teal); }
  </style>
</head>
<body>
  <main>
    <p>404</p>
    <h1>Off the chart.</h1>
    <p>That page or file does not exist. You can <a href="/">head back to The Good Ship</a>.</p>
  </main>
</body>
</html>
